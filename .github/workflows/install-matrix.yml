name: Install matrix

# v1.37.0 비용 절감:
# - 13 jobs → 2 jobs (static-lints + install-scenarios)
# - main push 트리거 제거 (PR 에서 이미 검증, 중복 실행 차단)
# - concurrency 그룹으로 같은 PR 새 push 시 이전 job cancel

on:
  pull_request:
    paths:
      - bootstrap.sh
      - .claude/**
      - .agents/**
      - .codex/**
      - .claude-plugin/**
      - .github/workflows/install-matrix.yml

concurrency:
  group: install-matrix-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  static-lints:
    name: Static lints (AGENTS.md cap · agent desc · plugin meta · settings · template cap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: All AGENTS.md / CLAUDE.md ≤ 300 lines
        run: |
          set -euo pipefail
          FAIL=0
          while IFS= read -r f; do
            LINES=$(wc -l < "$f" | tr -d ' ')
            if [ "$LINES" -gt 300 ]; then
              echo "❌ $f: $LINES > 300"
              FAIL=1
            fi
          done < <(find . \( -name 'AGENTS.md' -o -name 'AGENTS.*.md' -o -name 'CLAUDE.md' \) -not -path './.git/*' | grep -v node_modules | grep -v .worktrees)
          [ "$FAIL" = "0" ]

      - name: Stack templates — AGENTS.{stack}.md ≤ 120 lines
        run: |
          set -euo pipefail
          MAX=120; FAIL=0
          for f in .claude/templates/AGENTS.*.md; do
            LINES=$(wc -l < "$f" | tr -d ' ')
            if [ "$LINES" -gt "$MAX" ]; then
              echo "❌ $f: $LINES > $MAX"
              echo "   → 사용자 매 세션 토큰. 상세는 .agents/skills/ 로."
              FAIL=1
            fi
          done
          [ "$FAIL" = "0" ]

      - name: Agent description — single-line + length ≤ 250
        run: |
          set -euo pipefail
          MAX=250; FAIL=0
          for f in .claude/agents/*.md; do
            FM=$(awk '/^---$/{c++; if(c==1){next} if(c==2){exit}} c==1' "$f")
            DESC_LINE=$(echo "$FM" | grep -E '^description:' || echo "")
            if [ -z "$DESC_LINE" ]; then
              echo "❌ $f: description missing"; FAIL=1; continue
            fi
            if echo "$DESC_LINE" | grep -qE '^description:[[:space:]]*[|>][[:space:]]*$'; then
              echo "❌ $f: multi-line YAML scalar (Agent schema 는 single-line string 권장)"
              FAIL=1; continue
            fi
            DESC=$(echo "$DESC_LINE" | sed 's/^description:[[:space:]]*//')
            LEN=${#DESC}
            [ "$LEN" -gt "$MAX" ] && { echo "❌ $f: $LEN > $MAX"; FAIL=1; }
          done
          [ "$FAIL" = "0" ]

      - name: .claude-plugin meta — JSON + required fields + version sync
        run: |
          set -euo pipefail
          MARKETPLACE=.claude-plugin/marketplace.json
          PLUGIN=.claude-plugin/plugin.json
          [ -f "$MARKETPLACE" ] || { echo "ℹ️ no marketplace.json — skip"; exit 0; }

          jq -e . "$MARKETPLACE" >/dev/null
          [ -f "$PLUGIN" ] && jq -e . "$PLUGIN" >/dev/null

          # marketplace 필수 필드
          jq -e '.name | type == "string" and length > 0' "$MARKETPLACE" >/dev/null
          jq -e '.owner.name | type == "string" and length > 0' "$MARKETPLACE" >/dev/null
          jq -e '.plugins | type == "array" and length > 0' "$MARKETPLACE" >/dev/null

          # name kebab-case + 예약 이름 차단
          NAME=$(jq -r '.name' "$MARKETPLACE")
          [[ "$NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "❌ marketplace name '$NAME' must be kebab-case"; exit 1; }
          for reserved in claude-code-marketplace claude-code-plugins claude-plugins-official anthropic-marketplace anthropic-plugins agent-skills knowledge-work-plugins life-sciences; do
            [ "$NAME" = "$reserved" ] && { echo "❌ '$NAME' is Anthropic reserved"; exit 1; }
          done
          jq -e '.plugins[] | (.name | type == "string") and (.source != null)' "$MARKETPLACE" >/dev/null

          # plugin.json
          if [ -f "$PLUGIN" ]; then
            jq -e '.name | type == "string" and length > 0' "$PLUGIN" >/dev/null
            jq -e '.description | type == "string"' "$PLUGIN" >/dev/null
            jq -e '.version | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+")' "$PLUGIN" >/dev/null
            PV=$(jq -r '.version' "$PLUGIN")
            FV=$(cat VERSION | tr -d '[:space:]')
            [ "$PV" = "$FV" ] || { echo "❌ plugin.json version=$PV out of sync with VERSION=$FV"; exit 1; }
          fi

      - name: settings.{stack}.json — common base (plugins / allow / deny)
        run: |
          set -euo pipefail
          REQ_P='["commit-commands@claude-plugins-official","github@claude-plugins-official","hookify@claude-plugins-official"]'
          REQ_A='["Bash(cp *)","Bash(git *)","Bash(mkdir *)","Bash(mv *)","Bash(touch *)"]'
          REQ_D='["Bash(git push --force *)","Bash(git push -f *)","Bash(rm -rf /)","Bash(rm -rf ~*)"]'
          REQ_ASK='["Bash(gh secret set *)","Bash(gh secret delete *)","Bash(gh variable set *)","Bash(gh variable delete *)","Bash(gh workflow run *)"]'
          FORBID_P='["claude-md-management@claude-plugins-official"]'   # CLAUDE.md 를 만들면 AGENTS.md 가 무시됨
          FAIL=0
          for f in .claude/templates/settings.*.json; do
            STACK=$(basename "$f" .json | sed 's/^settings\.//')
            MP=$(jq --argjson req "$REQ_P" '$req - (.enabledPlugins // {} | keys)' "$f")
            MA=$(jq --argjson req "$REQ_A" '$req - (.permissions.allow // [])' "$f")
            MD=$(jq --argjson req "$REQ_D" '$req - (.permissions.deny // [])' "$f")
            [ "$(echo "$MP" | jq 'length')" -gt 0 ] && { echo "❌ $STACK: missing plugins: $(echo $MP|jq -c .)"; FAIL=1; }
            [ "$(echo "$MA" | jq 'length')" -gt 0 ] && { echo "❌ $STACK: missing allow: $(echo $MA|jq -c .)"; FAIL=1; }
            [ "$(echo "$MD" | jq 'length')" -gt 0 ] && { echo "❌ $STACK: missing deny: $(echo $MD|jq -c .)"; FAIL=1; }
            MK=$(jq --argjson req "$REQ_ASK" '$req - (.permissions.ask // [])' "$f")
            [ "$(echo "$MK" | jq 'length')" -gt 0 ] && { echo "❌ $STACK: missing ask: $(echo $MK|jq -c .)"; FAIL=1; }
            BAD=$(jq --argjson bad "$FORBID_P" '[$bad[] as $b | select((.enabledPlugins // {}) | has($b))]' "$f")
            [ "$(echo "$BAD" | jq 'length')" -gt 0 ] && { echo "❌ $STACK: forbidden plugin: $(echo $BAD|jq -c .)"; FAIL=1; }
          done
          [ "$FAIL" = "0" ]

      - name: orphan check — 모든 skill / agent 가 최소 1 mode 에서 keep
        run: |
          set -euo pipefail
          # v1.38.0 의 mcp-presets 누락 같은 사고 자동 catch:
          # init-cleanup.sh 의 어느 mode keep 목록에도 없는 skill/agent → fail

          MODES="kotlin go python nextjs flutter infra marketing sales product"
          ORPHAN_S=""
          for skill in $(ls -d .agents/skills/*/ 2>/dev/null | xargs -n1 basename); do
            KEPT=false
            for MODE in $MODES; do
              if ! bash .claude/scripts/init-cleanup.sh $MODE 2>&1 | grep -qE "skills/$skill\$"; then
                KEPT=true; break
              fi
            done
            [ "$KEPT" = "false" ] && ORPHAN_S="$ORPHAN_S $skill"
          done
          if [ -n "$ORPHAN_S" ]; then
            echo "❌ orphan skills (어느 mode 에도 keep 안 됨):$ORPHAN_S"
            echo "   → init-cleanup.sh 의 KEEP_SKILLS_COMMON 또는 stack 별 keep_for_stack 에 추가"
            exit 1
          fi

          ORPHAN_A=""
          for agent in $(ls .claude/agents/*.md 2>/dev/null | xargs -n1 basename | sed 's/\.md$//'); do
            KEPT=false
            for MODE in $MODES; do
              if ! bash .claude/scripts/init-cleanup.sh $MODE 2>&1 | grep -q "agents/$agent.md"; then
                KEPT=true; break
              fi
            done
            [ "$KEPT" = "false" ] && ORPHAN_A="$ORPHAN_A $agent"
          done
          if [ -n "$ORPHAN_A" ]; then
            echo "❌ orphan agents (어느 mode 에도 keep 안 됨):$ORPHAN_A"
            echo "   → init-cleanup.sh 의 KEEP_AGENTS_COMMON 또는 keep_for_stack 에 추가"
            exit 1
          fi

          echo "✅ orphan check: 모든 skill/agent 가 최소 1 mode 에서 keep"

      - name: mapping check — init-cleanup.sh keep 목록이 실제 파일과 일치
        run: |
          set -euo pipefail
          # init-cleanup.sh 안의 keep 이름이 실제 파일 존재와 일치하는지 검증
          # (typo "kotline-patterns" 같은 사고 catch)

          # init-cleanup.sh 에서 KEEP_* 및 keep_for_stack 에서 사용된 모든 이름 추출
          NAMES=$(grep -E '"(agents|skills|templates): ' .claude/scripts/init-cleanup.sh \
            | sed -E 's/^[[:space:]]*echo "(agents|skills|templates): //' \
            | sed 's/"$//' \
            | tr ' ' '\n' \
            | grep -E '\S' \
            | sort -u)
          # COMMON 변수에서도 추출
          COMMON=$(grep -E '^(KEEP_(AGENTS|SKILLS|TEMPLATES)_COMMON|WORKFLOW_SKILLS)=' .claude/scripts/init-cleanup.sh \
            | sed -E 's/^[A-Z_]+="//' \
            | sed 's/"$//' \
            | tr ' ' '\n' \
            | grep -E '\S' \
            | sort -u)
          ALL_NAMES=$(echo "$NAMES"$'\n'"$COMMON" | sort -u | grep -v '^$')

          FAIL=0
          while IFS= read -r name; do
            # keep_for_stack 의 동적 인자 (`${1}`) 는 skip — kotlin-multi/python-multi 등으로 풀려서 사용
            case "$name" in *'${1}'*) continue ;; esac

            if echo "$name" | grep -qE '\.(md|json|toml)$'; then
              # template 파일
              if [ ! -f ".claude/templates/$name" ]; then
                echo "❌ template referenced but not found: $name"
                FAIL=1
              fi
            else
              # agent 또는 skill — 둘 중 하나에 있어야
              if [ ! -f ".claude/agents/${name}.md" ] && [ ! -f ".agents/skills/${name}/SKILL.md" ]; then
                echo "❌ keep 이름 '$name' — .claude/agents/${name}.md 또는 .agents/skills/${name}/SKILL.md 둘 다 없음 (typo 가능)"
                FAIL=1
              fi
            fi
          done <<< "$ALL_NAMES"

          [ "$FAIL" = "0" ] && echo "✅ mapping check: 모든 keep 이름이 실제 파일과 매칭"
          [ "$FAIL" = "0" ]

      - name: settings.{stack}.json — required hooks contract
        run: |
          set -euo pipefail
          REQUIRED_ALL="session-start.sh safety-guard.sh usage-counter.sh memory-sync.sh"
          REQUIRED_CODE="pre-push.sh post-edit-lint.sh worktree-guard.sh stop-tests.sh model-router.sh"
          NON_CODE_STACKS="marketing sales product"
          FAIL=0
          for f in .claude/templates/settings.*.json; do
            STACK=$(basename "$f" .json | sed 's/^settings\.//')
            HOOKS=$(jq -r '[.hooks // {}] | map(to_entries[]) | .[].value | map(.hooks[]?.command // empty) | .[]' "$f" 2>/dev/null | grep -oE '[a-z-]+\.sh' | sort -u | tr '\n' ' ')

            for required in $REQUIRED_ALL; do
              case " $HOOKS " in
                *" $required "*) ;;
                *) echo "❌ $STACK: missing hook (all): $required"; FAIL=1 ;;
              esac
            done

            IS_NON_CODE=false
            for nc in $NON_CODE_STACKS; do [ "$STACK" = "$nc" ] && IS_NON_CODE=true && break; done

            if [ "$IS_NON_CODE" = "false" ]; then
              for required in $REQUIRED_CODE; do
                case " $HOOKS " in
                  *" $required "*) ;;
                  *) echo "❌ $STACK: missing hook (code): $required"; FAIL=1 ;;
                esac
              done
            fi
          done
          [ "$FAIL" = "0" ]

  install-scenarios:
    name: Install scenarios (fresh · platform · preserve · v1→v2 · pin · rollback · empty-hooks · init-cleanup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fresh install (curl | bash)
        run: |
          set -euo pipefail
          TARGET=$(mktemp -d)
          cd "$TARGET"
          STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh"
          test -d .claude
          test -f .claude/.starter-version
          test -f .claude/settings.json
          test -d .claude/agents && [ "$(ls -A .claude/agents)" ]
          test -f .agents/skills/init/SKILL.md
          [ "$(readlink .claude/skills)" = "../.agents/skills" ]
          test -f .claude/skills/start/SKILL.md
          test -d .claude/hooks && [ "$(ls -A .claude/hooks)" ]
          test -f .codex/hooks.json && test -d .codex/agents
          [ "$(cat .claude/.starter-platform)" = "both" ]
          test ! -f .claude/settings.local.json
          for h in .claude/hooks/*.sh .claude/githooks/*; do bash -n "$h"; done

      - name: Platform-specific installs (claude · codex)
        run: |
          set -euo pipefail
          T1=$(mktemp -d); (cd "$T1" && STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh" --platform claude > /dev/null)
          test -L "$T1/.claude/skills" && test -f "$T1/.claude/settings.json" && test ! -d "$T1/.codex"
          T2=$(mktemp -d); (cd "$T2" && STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh" --platform codex > /dev/null)
          test ! -e "$T2/.claude/skills" && test ! -f "$T2/.claude/settings.json" && test -f "$T2/.codex/hooks.json"
          test -f "$T2/.agents/skills/pr/SKILL.md"
          # 플랫폼은 기록되어 다음 update 에 유지된다
          (cd "$T2" && STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh" > /dev/null)
          [ "$(cat "$T2/.claude/.starter-platform")" = "codex" ] && test ! -e "$T2/.claude/skills"
          # codex config.toml 은 update 시 보존
          echo '# mine' >> "$T2/.codex/config.toml"
          (cd "$T2" && STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh" > /dev/null)
          grep -q '# mine' "$T2/.codex/config.toml"

      - name: Update preserves custom assets
        run: |
          set -euo pipefail
          TARGET=$(mktemp -d)
          cd "$TARGET"
          STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh"
          mkdir -p .claude/agents/custom .claude/commands/custom .claude/hooks/custom .agents/skills/my-skill
          echo "ag" > .claude/agents/custom/a.md
          echo "cm" > .claude/commands/custom/c.md
          echo "hk" > .claude/hooks/custom/h.sh
          printf -- '---\nname: my-skill\ndescription: x\n---\n' > .agents/skills/my-skill/SKILL.md
          echo "edited" >> .agents/skills/commit/SKILL.md
          echo '{"local":1}' > .claude/settings.local.json
          STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh"
          for f in .claude/agents/custom/a.md .claude/commands/custom/c.md .claude/hooks/custom/h.sh .agents/skills/my-skill/SKILL.md .claude/settings.local.json; do
            test -f "$f" || { echo "❌ lost: $f"; exit 1; }
          done
          ! grep -q edited .agents/skills/commit/SKILL.md || { echo "❌ starter skill not refreshed"; exit 1; }

      - name: Update with --no-preserve wipes custom
        run: |
          set -euo pipefail
          TARGET=$(mktemp -d)
          cd "$TARGET"
          STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh"
          mkdir -p .claude/agents/custom
          echo "x" > .claude/agents/custom/a.md
          STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh" --no-preserve
          [ ! -f .claude/agents/custom/a.md ] || { echo "❌ --no-preserve left custom"; exit 1; }

      - name: v1 → v2 update migrates custom skills
        run: |
          set -euo pipefail
          V1=$(git ls-remote --tags --refs https://github.com/nogamsung/coding-agent-starter.git | awk -F/ '{print $NF}' | grep -E '^v1\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ -z "$V1" ] && { echo "ℹ️ no v1 tag — skip"; exit 0; }
          TARGET=$(mktemp -d)
          cd "$TARGET"
          bash "$GITHUB_WORKSPACE/bootstrap.sh" --version "$V1" > /dev/null
          test -d .claude/commands && test ! -L .claude/skills
          mkdir -p .claude/skills/custom
          printf '# legacy\n' > .claude/skills/custom/legacy.md
          echo "# old" > CLAUDE.md
          OUT=$(STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh")
          test -f .agents/skills/legacy/SKILL.md
          grep -q '^name: legacy' .agents/skills/legacy/SKILL.md
          test ! -d .claude/commands
          echo "$OUT" | grep -q migrate-agents-md
          bash .claude/scripts/migrate-agents-md.sh --apply
          test -f AGENTS.md && test ! -f CLAUDE.md

      - name: Version pin (--version)
        run: |
          set -euo pipefail
          TAG=$(git ls-remote --tags --refs https://github.com/nogamsung/coding-agent-starter.git | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -2 | head -1)
          [ -z "$TAG" ] && { echo "ℹ️ no prior tag — skip"; exit 0; }
          TARGET=$(mktemp -d)
          cd "$TARGET"
          STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh" --version "$TAG"
          [ "$(cat .claude/.starter-version)" = "${TAG#v}" ] || { echo "❌ pin failed"; exit 1; }

      - name: Update writes .starter-version-prev
        run: |
          set -euo pipefail
          TAG=$(git ls-remote --tags --refs https://github.com/nogamsung/coding-agent-starter.git | awk -F/ '{print $NF}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ -z "$TAG" ] && exit 0
          TARGET=$(mktemp -d)
          cd "$TARGET"
          STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh" --version "$TAG"
          OLD=$(cat .claude/.starter-version)
          STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh"
          [ "$(cat .claude/.starter-version-prev)" = "$OLD" ] || { echo "❌ prev mismatch"; exit 1; }

      - name: Hooks fail silently on empty project (no stacks.json)
        run: |
          set -euo pipefail
          TARGET=$(mktemp -d)
          cd "$TARGET"
          STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh" > /dev/null
          git init -q .
          bash .claude/hooks/session-start.sh > /dev/null
          for h in post-edit-lint worktree-guard; do
            echo '{"tool_input":{"file_path":"random.py"}}' | bash ".claude/hooks/$h.sh"
          done
          echo '{"tool_input":{"command":"ls"}}' | bash .claude/hooks/safety-guard.sh
          echo '{"tool_input":{"command":"git push"}}' | bash .claude/hooks/pre-push.sh
          echo '{}' | bash .claude/hooks/stop-tests.sh
          echo '{}' | bash .claude/hooks/memory-sync.sh commit
          echo '{"tool_input":{"subagent_type":"planner"}}' | bash .claude/hooks/model-router.sh claude
          echo '{"tool_name":"apply_patch","tool_input":{"command":"*** Begin Patch\n*** Update File: a.py\n*** End Patch"}}' | bash .claude/hooks/codex-adapter.sh pre-edit
          OUT=$(git status --porcelain)
          [ -z "$(echo "$OUT" | grep -v -E '^\?\? \.(claude|agents|codex)/$')" ] || { echo "❌ hooks wrote files: $OUT"; exit 1; }

      - name: init-cleanup.sh — 9 single-stack dry-run expected counts
        run: |
          set -euo pipefail
          declare -A EXPECT=(
            [kotlin]="18 11 29"
            [go]="19 11 29"
            [python]="15 9 29"
            [nextjs]="19 11 29"
            [flutter]="19 13 29"
            [infra]="22 12 29"
            [marketing]="23 17 27"
            [sales]="23 17 27"
            [product]="23 17 26"
          )
          FAIL=0
          for MODE in "${!EXPECT[@]}"; do
            TARGET=$(mktemp -d)
            (cd "$TARGET" && STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh" > /dev/null)
            RESULT=$(cd "$TARGET" && bash "$GITHUB_WORKSPACE/.claude/scripts/init-cleanup.sh" "$MODE" 2>&1)
            A=$(echo "$RESULT" | grep "agents:" | head -1 | grep -oE '[0-9]+')
            S=$(echo "$RESULT" | grep "skills:" | head -1 | grep -oE '[0-9]+')
            T=$(echo "$RESULT" | grep "templates:" | head -1 | grep -oE '[0-9]+')
            EXPECTED="${EXPECT[$MODE]}"
            [ "$A $S $T" = "$EXPECTED" ] || { echo "❌ $MODE expected=[$EXPECTED] actual=[$A $S $T]"; FAIL=1; }
            rm -rf "$TARGET"
          done
          [ "$FAIL" = "0" ]

      - name: init-cleanup.sh — --apply + 4 custom 자산 보존
        run: |
          set -euo pipefail
          TARGET=$(mktemp -d)
          cd "$TARGET"
          STARTER_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/bootstrap.sh" > /dev/null
          mkdir -p .claude/agents/custom .agents/skills/my-skill .claude/hooks/custom .claude/commands/custom
          echo "ag" > .claude/agents/custom/a.md
          printf -- '---\nname: my-skill\ndescription: x\n---\n' > .agents/skills/my-skill/SKILL.md
          echo "hk" > .claude/hooks/custom/h.sh
          echo "cm" > .claude/commands/custom/c.md
          bash "$GITHUB_WORKSPACE/.claude/scripts/init-cleanup.sh" kotlin --apply > /dev/null
          for f in .claude/agents/custom/a.md .agents/skills/my-skill/SKILL.md .claude/hooks/custom/h.sh .claude/commands/custom/c.md .agents/skills/commit/SKILL.md .agents/skills/pr/SKILL.md; do
            [ -f "$f" ] || { echo "❌ LOST: $f"; exit 1; }
          done
          [ "$(ls .claude/agents/*.md | wc -l | tr -d ' ')" = "9" ]
          [ "$(ls -d .agents/skills/*/ | wc -l | tr -d ' ')" = "27" ]   # 9 패턴 + 17 워크플로 + my-skill
