name: Secret Scan

# PR 에 새로 들어오는 커밋만 gitleaks 로 검사한다(이미 기본 브랜치에 있는 기록은 대상 아님).
# 로컬 .claude/githooks/pre-commit(gitleaks 설치 시)과 같은 설정(.gitleaks.toml)을 쓴다 — --no-verify 로 넘겨도 여기서 막힌다.
# 오탐은 .gitleaks.toml 에 경로·이유와 함께.
on:
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (PR 커밋 범위)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CFG=()
          [ -f .gitleaks.toml ] && CFG=(--config /repo/.gitleaks.toml)
          # 버전 고정 — 올릴 때 태그를 바꾼다 (공급망 위생: 가능하면 다이제스트로 고정)
          docker run --rm -v "$PWD:/repo" -w /repo --user "$(id -u):$(id -g)" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo "${CFG[@]}" --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact --no-banner --exit-code 1
